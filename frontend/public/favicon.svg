<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Teal #123B46 to Dark #081D23 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164450" />
      <stop offset="50%" stop-color="#123B46" />
      <stop offset="100%" stop-color="#081D23" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D794" />
      <stop offset="40%" stop-color="#CFA34A" />
      <stop offset="100%" stop-color="#9C7323" />
    </linearGradient>

    <!-- River Sediment / Alluvial Wave Gradient -->
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CFA34A" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#F2D794" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#CFA34A" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.95" />

  <!-- Outer Cultural Heritage Radial Ring -->
  <circle cx="256" cy="205" r="120" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.45" stroke-dasharray="10 6" />
  <circle cx="256" cy="205" r="132" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.25" />

  <!-- Lotus Petals / Pho Hien Heritage Arch Stylization -->
  <!-- Center Petal -->
  <path d="M 256 95 C 230 145, 230 190, 256 225 C 282 190, 282 145, 256 95 Z" fill="url(#goldGrad)" opacity="0.95" />
  <!-- Left Inner Petal -->
  <path d="M 256 225 C 215 210, 190 165, 205 125 C 225 155, 240 195, 256 225 Z" fill="url(#goldGrad)" opacity="0.8" />
  <!-- Right Inner Petal -->
  <path d="M 256 225 C 297 210, 322 165, 307 125 C 287 155, 272 195, 256 225 Z" fill="url(#goldGrad)" opacity="0.8" />
  <!-- Left Outer Petal -->
  <path d="M 256 230 C 190 220, 160 175, 170 150 C 185 180, 215 210, 256 230 Z" fill="url(#goldGrad)" opacity="0.55" />
  <!-- Right Outer Petal -->
  <path d="M 256 230 C 322 220, 352 175, 342 150 C 327 180, 297 210, 256 230 Z" fill="url(#goldGrad)" opacity="0.55" />

  <!-- Golden Alluvial Waves (Phù Sa Sông Hồng) -->
  <path d="M 90 280 Q 170 240, 256 280 T 422 280" fill="none" stroke="url(#riverGrad)" stroke-width="6" stroke-linecap="round" />
  <path d="M 70 310 Q 160 270, 256 310 T 442 310" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
  <path d="M 110 340 Q 180 305, 256 340 T 402 340" fill="none" stroke="url(#riverGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Monogram HY (Hưng Yên) in Royal Gold -->
  <text x="256" y="445" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Be Vietnam Pro', system-ui, sans-serif" font-weight="900" font-size="78" fill="url(#goldGrad)" filter="url(#goldGlow)" letter-spacing="6">HY</text>
</svg>
